[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://erp-software-o8yf.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://erp-software-o8yf.onrender.com/uploads/:splat"
  status = 200
  force = true